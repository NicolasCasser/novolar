services:
  postgres-test:
    image: postgres:17-alpine
    container_name: novolar-postgres-test
    environment:
      POSTGRES_DB: ${TEST_POSTGRES_DB}
      POSTGRES_USER: ${TEST_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD}
    ports:
      - '${TEST_POSTGRES_PORT}:5432'
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

  backend-test:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: development
    container_name: novolar-backend-test
    user: '${LOCAL_UID}:${LOCAL_GID}'
    environment:
      NODE_ENV: test
      POSTGRES_HOST: postgres-test
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${TEST_POSTGRES_DB}
      POSTGRES_USER: ${TEST_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD}
      POSTGRES_SSL: ${TEST_POSTGRES_SSL}
      TEST_POSTGRES_HOST: postgres-test
      TEST_POSTGRES_PORT: 5432
      TEST_POSTGRES_DB: ${TEST_POSTGRES_DB}
      TEST_POSTGRES_USER: ${TEST_POSTGRES_USER}
      TEST_POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD}
      TEST_POSTGRES_SSL: ${TEST_POSTGRES_SSL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - ./apps/backend:/app/apps/backend
      - backend_node_modules:/app/node_modules
    depends_on:
      - postgres-test
    command: >
      sh -c "
        npm install &&
        npm run migration:test:run &&
        npm run seed:test:admin &&
        tail -f /dev/null
      "

volumes:
  postgres_test_data:
  backend_node_modules: